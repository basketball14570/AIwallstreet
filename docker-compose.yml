services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: flow
      POSTGRES_PASSWORD: flow
      POSTGRES_DB: flow
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flow:flow@db:5432/flow
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    volumes: ["models:/app/models"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flow:flow@db:5432/flow
      REDIS_URL: redis://redis:6379/0
    volumes: ["models:/app/models"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  scheduler:
    build: .
    command: python -m app.jobs.nightly --loop 86400
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flow:flow@db:5432/flow
      REDIS_URL: redis://redis:6379/0
    volumes: ["models:/app/models"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  models:
